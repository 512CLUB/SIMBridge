<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Pure White Background -->
  <rect width="512" height="512" fill="#ffffff"/>

  <!-- Outer SIM Card Body with rounded corners and top-right bevel cut -->
  <path d="M 175 90
           L 285 90
           C 298 90, 308 94, 316 102
           L 364 150
           C 372 158, 376 168, 376 181
           L 376 394
           C 376 412, 361 426, 343 426
           L 169 426
           C 151 426, 136 412, 136 394
           L 136 122
           C 136 104, 151 90, 169 90 Z"
        fill="none"
        stroke="#000000"
        stroke-width="22"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Chip Outer Rounded Frame -->
  <rect x="180" y="210" width="152" height="164" rx="22" ry="22"
        fill="none"
        stroke="#000000"
        stroke-width="18"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Horizontal Contact Segment Dividers -->
  <line x1="180" y1="264" x2="332" y2="264" stroke="#000000" stroke-width="16" stroke-linecap="round"/>
  <line x1="180" y1="320" x2="332" y2="320" stroke="#000000" stroke-width="16" stroke-linecap="round"/>

  <!-- Top 3-Pin Vertical Contact Dividers -->
  <line x1="231" y1="210" x2="231" y2="264" stroke="#000000" stroke-width="16" stroke-linecap="round"/>
  <line x1="281" y1="210" x2="281" y2="264" stroke="#000000" stroke-width="16" stroke-linecap="round"/>

  <!-- Bottom 3-Pin Vertical Contact Dividers -->
  <line x1="231" y1="320" x2="231" y2="374" stroke="#000000" stroke-width="16" stroke-linecap="round"/>
  <line x1="281" y1="320" x2="281" y2="374" stroke="#000000" stroke-width="16" stroke-linecap="round"/>
</svg>
